services:
  app:
    build: .
    container_name: wctby-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wctby
      DB_USERNAME: wctby
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/storage

  mysql:
    image: mysql:8.4
    container_name: wctby-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: wctby
      MYSQL_USER: wctby
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  app_storage:
  mysql_data:
